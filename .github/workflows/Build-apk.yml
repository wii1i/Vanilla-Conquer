name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Sumber & Submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cek Struktur Proyek & Izin Gradle
        run: |
          ls -la
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          else
            echo "File gradlew tidak ditemukan di root maupun folder android/"
            find . -maxdepth 3 -name "gradlew" -o -name "CMakeLists.txt"
            exit 1
          fi

      - name: Kompilasi APK Debug (ARM64)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            cd android && ./gradlew assembleDebug
          fi

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: VanillaConquer-ARM64-APK
          path: '**/build/outputs/apk/debug/*.apk'
