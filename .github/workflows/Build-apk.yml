name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, vanilla ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Sumber
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Kompilasi SDL2 & OpenAL (ARM64)
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)}}"
          TOOLCHAIN="$NDK_DIR/build/cmake/android.toolchain.cmake"

          git clone --depth 1 --branch release-2.30.11 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps \
            -DSDL_TEST=OFF
          cmake --build /tmp/SDL/build -j$(nproc)
          cmake --install /tmp/SDL/build

          git clone --depth 1 --branch 1.23.1 https://github.com/kcat/openal-soft.git /tmp/openal
          cmake -S /tmp/openal -B /tmp/openal/build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/android-deps \
            -DALSOFT_UTILS=OFF \
            -DALSOFT_EXAMPLES=OFF \
            -DALSOFT_TESTS=OFF
          cmake --build /tmp/openal/build -j$(nproc)
          cmake --install /tmp/openal/build

      - name: Kompilasi Engine Vanilla-Conquer (ARM64)
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)}}"
          TOOLCHAIN="$NDK_DIR/build/cmake/android.toolchain.cmake"

          # [FIX 1] Nama target CMake yang benar: VanillaRA / VanillaTD (huruf besar).
          # [FIX 2] Semua baca/tulis file pakai mode binary (rb/wb) karena
          #         startup.cpp mengandung byte CP437 non-UTF-8 (mis. "Mémoire").
          python3 - << 'PY'
          import sys

          targets = {
              "redalert/CMakeLists.txt": "VanillaRA",
              "tiberiandawn/CMakeLists.txt": "VanillaTD",
          }
          for path, target in targets.items():
              with open(path, "rb") as f:
                  data = f.read()
              old = ("add_executable(%s" % target).encode("ascii")
              new = ("add_library(%s SHARED" % target).encode("ascii")
              if old not in data:
                  sys.exit("Pola '%s' tidak ditemukan di %s!" % (old.decode(), path))
              with open(path, "wb") as f:
                  f.write(data.replace(old, new))
              print("Patch OK:", path)

          # Jaga agar entry point tetap bernama 'main' (bukan SDL_main),
          # karena SDLActivity di step packaging akan dipatch memanggil 'main'.
          for path in ["redalert/startup.cpp", "tiberiandawn/startup.cpp"]:
              with open(path, "rb") as f:
                  data = f.read()
              old = b"int main(int argc"
              new = b"#undef main\nint main(int argc"
              if old not in data:
                  sys.exit("Pola main() tidak ditemukan di %s!" % path)
              with open(path, "wb") as f:
                  f.write(data.replace(old, new, 1))
              print("Patch OK:", path)
          PY

          cmake -S . -B build-android \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_PREFIX_PATH=/tmp/android-deps \
            -DSDL2_INCLUDE_DIR=/tmp/android-deps/include/SDL2 \
            -DSDL2_LIBRARY=/tmp/android-deps/lib/libSDL2.so \
            -DSDL2_SDLMAIN_LIBRARY=/tmp/android-deps/lib/libSDL2main.a \
            -DOPENAL_INCLUDE_DIR=/tmp/android-deps/include/AL \
            -DOPENAL_LIBRARY=/tmp/android-deps/lib/libopenal.so \
            -DBUILD_TOOLS=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build-android -j$(nproc)

          # [FIX 3] Verifikasi gagal-cepat: .so harus ada dan mengekspor 'main'
          NM="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for GAME in vanillara vanillatd; do
            SO_FILE=$(find build-android -name "lib${GAME}.so" | head -n 1)
            if [ -z "$SO_FILE" ]; then
              echo "File lib${GAME}.so tidak ditemukan!"
              exit 1
            fi
            echo "== $SO_FILE =="
            "$NM" -D --defined-only "$SO_FILE" | grep -w main || { echo "Simbol 'main' tidak diekspor oleh $SO_FILE!"; exit 1; }
          done

      - name: Kemas APK VanillaRA & VanillaTD
        run: |
          mkdir -p /tmp/apk-out
          for GAME in vanillara vanillatd; do
            if [ "$GAME" = "vanillara" ]; then
              APP_ID="com.vanilla.ra"
              APP_NAME="VanillaRA"
            else
              APP_ID="com.vanilla.td"
              APP_NAME="VanillaTD"
            fi

            rm -rf /tmp/android-proj
            cp -r /tmp/SDL/android-project /tmp/android-proj
            rm -rf /tmp/android-proj/app/jni
            mkdir -p /tmp/android-proj/app/src/main/jniLibs/arm64-v8a

            cp /tmp/android-deps/lib/libSDL2.so /tmp/android-proj/app/src/main/jniLibs/arm64-v8a/
            cp /tmp/android-deps/lib/libopenal.so /tmp/android-proj/app/src/main/jniLibs/arm64-v8a/
            SO_FILE=$(find build-android -name "lib${GAME}.so" | head -n 1)
            if [ -z "$SO_FILE" ]; then
              echo "File lib${GAME}.so tidak ditemukan!"
              exit 1
            fi
            cp "$SO_FILE" /tmp/android-proj/app/src/main/jniLibs/arm64-v8a/

            cat <<EOF > /tmp/android-proj/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace "org.libsdl.app"
              compileSdkVersion 34
              defaultConfig {
                  applicationId "$APP_ID"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a' }
              }
              buildTypes { debug { debuggable true } }
              lint { abortOnError false }
          }
          EOF

            python3 - "$GAME" "$APP_NAME" << 'PY'
          import sys
          game, app_name = sys.argv[1], sys.argv[2]

          s_path = "/tmp/android-proj/app/src/main/res/values/strings.xml"
          with open(s_path, "r") as f: s = f.read()
          with open(s_path, "w") as f: f.write(s.replace("Game", app_name))

          m_path = "/tmp/android-proj/app/src/main/AndroidManifest.xml"
          with open(m_path, "r") as f: m = f.read()
          m = m.replace('<activity android:name="SDLActivity"', '<activity android:name="SDLActivity" android:screenOrientation="landscape"')
          with open(m_path, "w") as f: f.write(m)

          j_path = "/tmp/android-proj/app/src/main/java/org/libsdl/app/SDLActivity.java"
          with open(j_path, "r") as f: j = f.read()
          j = j.replace('"main"', f'"openal", "{game}"')
          # [FIX 4] Engine mengekspor 'main', bukan 'SDL_main'
          j = j.replace('return "SDL_main";', 'return "main";')
          # [FIX 5] chdir ke folder data game + matikan emulasi touch<->mouse
          #         agar input murni keyboard & mouse eksternal
          chdir_hook = (
              'super.onCreate(savedInstanceState);\n'
              '        try { android.system.Os.setenv("SDL_TOUCH_MOUSE_EVENTS", "0", true); android.system.Os.setenv("SDL_MOUSE_TOUCH_EVENTS", "0", true); } catch (Exception e) {}\n'
              '        java.io.File d = getExternalFilesDir(null); if (d != null) { d.mkdirs(); try { android.system.Os.chdir(d.getAbsolutePath()); } catch (Exception e) {} }'
          )
          j = j.replace('super.onCreate(savedInstanceState);', chdir_hook, 1)
          with open(j_path, "w") as f: f.write(j)
          PY

            chmod +x /tmp/android-proj/gradlew
            (cd /tmp/android-proj && ./gradlew assembleDebug)
            cp /tmp/android-proj/app/build/outputs/apk/debug/app-debug.apk "/tmp/apk-out/${APP_NAME}-ARM64.apk"
          done

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: VanillaConquer-ARM64-APKs
          path: /tmp/apk-out/*.apk
